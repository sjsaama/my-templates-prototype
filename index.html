<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Templates — AMD EHR</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --accent:#747AF7;
  --accent-50:#E8EBFF;
  --accent-100:#D4DAFC;
  --ink:#444444;
  --gray:#797979;
  --gray-light:#B9B8B8;
  --border:#E7E7E9;
  --bg-chip:#F3F4F6;
  --bg-soft:#F9FAFB;
  --coral:#FF8888;
  --teal:#11C9C9;
  --teal-50:#E6F8F8;
  --teal-text:#0B9A9C;
  --amber:#F49908;
  --amber-bg:#FCEFD6;
  --amber-text:#C46A06;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;
  --space-6:24px;--space-7:32px;--space-8:40px;--space-9:48px;
  --row-pad:20px;
  --page-pad-y:46px;--page-pad-x:40px;
  --table-gap:10px;--thead-min-height:48px;
  --tpl-item-pad-y:18px;--collapse-top:52px;
  --table-lead:14px;--grip-w:22px;--expander-w:24px;--namecell-pl:4px;--row-name-gap:2px;
  --table-gutter:calc(var(--table-lead) + var(--grip-w) + var(--row-name-gap) + var(--expander-w) + var(--namecell-pl));
  --tree-step:20px;
  --radius:8px;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:'Lato',-apple-system,sans-serif;
  color:var(--ink);
  background:#fff;
  -webkit-font-smoothing:antialiased;
}
#root,.app{height:100vh;}
.app{display:flex;overflow:hidden;position:relative;}
.dev-ribbon{position:fixed;top:0;left:90px;right:0;z-index:50;background:#2A2D3A;color:#fff;font-size:12px;font-weight:500;padding:8px 16px;text-align:center;line-height:1.4;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.dev-ribbon strong{font-weight:700;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

/* ───────── Sidebar ───────── */
.sidebar{width:90px;flex:0 0 90px;background:var(--accent);display:flex;flex-direction:column;align-items:center;}
.sidebar-logo{width:90px;height:100px;background:var(--accent-50);display:flex;align-items:center;justify-content:center;}
.logo-mark{display:flex;align-items:center;justify-content:center;}
.sidebar-items{flex:1;display:flex;flex-direction:column;align-items:center;width:100%;padding:24px 10px;gap:26px;}
.sidebar-items .nav-item:nth-child(4){margin-top:auto;}
.nav-item{width:70px;display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;border-radius:8px;padding:8px 0;transition:background .15s;}
.nav-item:hover{background:rgba(255,255,255,.12);}
.nav-item--active{background:rgba(255,255,255,.16);}
.nav-ico{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#fff;}
.nav-ico--badge{background:#fff;color:var(--accent);border-radius:50%;width:30px;height:30px;}
.nav-label{font-size:13px;font-weight:500;line-height:1.2;}

/* ───────── Template list panel ───────── */
.tpl-panel{width:300px;flex:0 0 300px;border-right:1px solid var(--border);position:relative;
  transition:flex-basis .26s cubic-bezier(.4,0,.2,1),width .26s cubic-bezier(.4,0,.2,1);}
.tpl-inner{width:300px;height:100%;display:flex;flex-direction:column;padding:var(--page-pad-y) 0 0;overflow:hidden;
  transition:opacity .18s;}
.tpl-panel--collapsed{width:0;flex-basis:0;border-right-color:transparent;}
.tpl-panel--collapsed .tpl-inner{opacity:0;pointer-events:none;}
.tpl-collapse{position:absolute;top:var(--collapse-top);right:-14px;width:28px;height:28px;border-radius:50%;background:#fff;
  border:1px solid var(--border);box-shadow:0 2px 6px rgba(40,47,111,.12);display:flex;align-items:center;justify-content:center;
  color:var(--gray);z-index:20;transition:color .12s,border-color .12s;}
.tpl-collapse:hover{color:var(--accent);border-color:var(--accent-100);}
.tpl-collapse svg{transform:rotate(90deg);transition:transform .22s;}
.tpl-panel--collapsed .tpl-collapse svg{transform:rotate(-90deg);}
.tpl-title{font-size:24px;font-weight:700;color:var(--ink);margin:0 0 20px;padding:0 24px;}
.tpl-create{margin:0 20px 10px;width:calc(100% - 40px);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:700;}
.tpl-request{margin:0 20px 16px;width:calc(100% - 40px);font-size:13px;color:var(--gray);text-align:left;padding:6px 0;}
.tpl-tabs{display:flex;gap:0;margin:0 16px 14px;padding:3px;background:var(--bg-chip);border-radius:10px;}
.tpl-tab{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-size:12px;font-weight:600;color:var(--gray);cursor:pointer;transition:background .12s,color .12s,box-shadow .12s;}
.tpl-tab:hover{color:var(--ink);}
.tpl-tab--active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(40,47,111,.12);}
.tpl-tab-count{display:inline-block;margin-left:4px;font-size:11px;font-weight:700;color:var(--gray-light);}
.tpl-tab--active .tpl-tab-count{color:var(--accent);}
.tpl-search-wrap{position:relative;margin:0 16px 12px;}
.tpl-search{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:8px;padding:9px 32px 9px 34px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;}
.tpl-search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-50);}
.tpl-search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--gray-light);display:flex;}
.tpl-search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;color:var(--gray);font-size:11px;}
.tpl-search-clear:hover{background:var(--bg-chip);color:var(--ink);}
.tpl-empty-tab,.tpl-no-results{padding:18px 24px;font-size:13px;line-height:1.45;color:var(--gray);}
.ed-ownership{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
.ed-ownership--self{background:var(--teal-50);color:var(--teal-text);}
.ed-ownership--ops{background:var(--bg-chip);color:var(--gray);}
.ed-ownership-hint{margin:8px 0 0;font-size:13px;line-height:1.4;color:var(--gray);max-width:52ch;}
.adv-field--push-mode{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
.modal--create-tpl{width:min(600px,100%);}
.create-steps{display:flex;gap:0;padding:16px 28px;border-bottom:1px solid var(--border);background:var(--bg-soft);}
.create-step{display:flex;align-items:center;gap:8px;flex:1;font-size:13px;color:var(--gray-light);}
.create-step--active{color:var(--accent);font-weight:700;}
.create-step--done{color:var(--teal-text);}
.create-step-num{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.create-step--active .create-step-num{background:var(--accent);color:#fff;border-color:var(--accent);}
.create-step--done .create-step-num{background:var(--teal-text);color:#fff;border-color:var(--teal-text);}
.create-step-body{display:flex;flex-direction:column;gap:18px;}
.create-type-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.create-type-btn{padding:8px 14px;border-radius:7px;border:2px solid var(--border);font-size:13px;font-weight:600;color:var(--gray);background:#fff;transition:all .15s;}
.create-type-btn--on{border-color:var(--accent);color:var(--accent);background:var(--accent-50);}
.create-ehr-notice{background:var(--accent-50);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;}
.create-ehr-label{font-size:13px;font-weight:700;color:var(--accent);}
.create-ehr-hint{font-size:12px;color:var(--gray);}
.create-ehr-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.create-ehr-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:8px;border:2px solid var(--border);text-align:left;background:#fff;font-size:14px;color:var(--ink);transition:all .15s;}
.create-ehr-item:hover{border-color:var(--accent);background:var(--accent-50);}
.create-ehr-item--on{border-color:var(--accent);background:var(--accent-50);}
.create-ehr-item-name{font-weight:600;}
.create-ehr-check{color:var(--accent);font-weight:700;}
.create-review-notice{margin-bottom:4px;}
.create-review-lead{font-size:15px;font-weight:600;color:var(--ink);margin:0;}
.create-review-table{width:100%;border-collapse:collapse;font-size:14px;}
.create-review-table td{padding:10px 12px;border-bottom:1px solid var(--border);}
.create-review-table td:first-child{color:var(--gray);width:140px;font-weight:600;}
.create-review-hint{font-size:12px;color:var(--gray);margin:16px 0 0;line-height:1.5;}
.copy-from-select{width:100%;margin-top:6px;}
.copy-from-preview{margin-top:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-soft);max-height:200px;overflow-y:auto;}
.copy-from-preview-label{padding:8px 12px 6px;font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
.copy-from-preview-empty{padding:10px 12px;font-size:13px;color:var(--gray);}
.copy-from-preview-row{display:flex;align-items:center;gap:7px;padding-top:5px;padding-bottom:5px;padding-right:12px;}
.copy-from-preview-row--off{opacity:.55;}
.copy-from-preview-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.copy-from-preview-name{font-size:13px;color:var(--ink);flex:1;}
.copy-from-preview-badge{font-size:10px;color:var(--gray);background:var(--bg-chip);border-radius:4px;padding:1px 5px;}
/* Gallery */
.modal--create-tpl{width:min(700px,100%);}
.modal-body--gallery{padding:0;overflow-y:auto;}
.gallery-wrap{display:flex;flex-direction:column;gap:0;}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px 24px;}
.gallery-card{border:2px solid var(--border);border-radius:10px;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;transition:border-color .15s,box-shadow .15s;background:#fff;}
.gallery-card:hover{border-color:var(--accent-100);box-shadow:0 2px 10px rgba(116,122,247,.1);}
.gallery-card--on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-50);}
.gallery-card-blank-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:32px 16px;background:var(--bg-soft);}
.gallery-blank-plus{font-size:28px;color:var(--gray-light);line-height:1;}
.gallery-blank-label{font-size:13px;font-weight:600;color:var(--gray);}
.gallery-card-body{flex:1;padding:12px 12px 8px;display:flex;flex-direction:column;gap:6px;overflow:hidden;}
.gallery-mini-section{display:flex;flex-direction:column;gap:1px;}
.gallery-mini-heading{font-size:8px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gallery-mini-text{font-size:9px;color:var(--gray);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.gallery-mini-more{font-size:9px;color:var(--gray-light);margin-top:2px;}
.gallery-card-footer{padding:8px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;background:var(--bg-soft);}
.gallery-card-name{font-size:11px;font-weight:700;color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gallery-card-tag{font-size:10px;color:var(--accent);background:var(--accent-50);border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0;}
.gallery-preview-btn{font-size:10px;color:var(--gray);padding:2px 6px;border-radius:4px;border:1px solid var(--border);background:#fff;flex-shrink:0;white-space:nowrap;}
.gallery-preview-btn:hover{color:var(--accent);border-color:var(--accent-100);}
.gallery-mytpls{border-top:1px solid var(--border);padding:16px 24px 20px;}
.gallery-section-label{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.gallery-my-list{display:flex;flex-direction:column;gap:6px;}
.gallery-my-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border:2px solid var(--border);border-radius:8px;cursor:pointer;background:#fff;transition:border-color .12s;}
.gallery-my-item:hover{border-color:var(--accent-100);}
.gallery-my-item--on{border-color:var(--accent);background:var(--accent-50);}
.gallery-my-name{font-size:13px;font-weight:600;color:var(--ink);flex:1;}
.gallery-my-tag{font-size:11px;color:var(--gray);}
.gallery-preview-full{display:flex;flex-direction:column;height:100%;}
.gallery-preview-back{padding:14px 24px 0;font-size:13px;color:var(--accent);background:none;border:none;cursor:pointer;text-align:left;font-weight:600;}
.gallery-preview-meta{display:flex;align-items:center;gap:10px;padding:10px 24px 14px;border-bottom:1px solid var(--border);}
.gallery-preview-title{font-size:16px;font-weight:700;color:var(--ink);}
.gallery-preview-note{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:16px;}
.gallery-preview-section{display:flex;flex-direction:column;gap:4px;}
.gallery-preview-section-name{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;}
.gallery-preview-section-text{font-size:13px;color:var(--ink);line-height:1.6;white-space:pre-line;}
.gallery-preview-foot{padding:14px 24px;border-top:1px solid var(--border);}
.modal--preview{max-width:680px;width:100%;max-height:82vh;display:flex;flex-direction:column;}
.preview-body{display:flex;flex-direction:column;gap:16px;overflow-y:auto;padding:20px 28px;}
.preview-transcript-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.preview-transcript-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 16px;font-size:13px;font-weight:600;color:var(--gray);background:var(--bg-soft);border:none;cursor:pointer;}
.preview-transcript-toggle:hover{background:var(--bg-chip);}
.preview-chevron{font-size:11px;}
.preview-transcript-text{margin:0;padding:14px 16px;font-size:12px;line-height:1.7;color:var(--ink);white-space:pre-wrap;background:#fff;font-family:inherit;border-top:1px solid var(--border);}
.preview-note-wrap{display:flex;flex-direction:column;gap:0;}
.preview-note-meta{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.preview-note-tpl{font-size:15px;font-weight:700;color:var(--ink);}
.preview-note-ehr{font-size:12px;color:var(--gray);font-family:monospace;}
.preview-section{border-bottom:1px solid var(--border);padding:14px 0;}
.preview-section:last-child{border-bottom:none;}
.preview-section-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:6px;}
.preview-section-text{font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-line;}
.preview-empty{font-size:14px;color:var(--gray);padding:24px 0;text-align:center;}
.btn-outline{border:2px solid var(--accent);border-radius:8px;padding:11px 16px;display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;transition:background .15s;}
.btn-outline:hover{background:var(--accent-50);}
.btn-outline-main{font-weight:700;font-size:14px;color:var(--accent);white-space:nowrap;}
.btn-outline-sub{font-size:12px;color:var(--accent);opacity:.85;}
.btn-outline-sub--coral{color:var(--coral);opacity:1;font-weight:700;}
.tpl-scroll{flex:1;overflow-y:auto;padding-bottom:30px;}
.tpl-group-label{font-size:14px;font-weight:700;color:var(--gray);background:var(--bg-chip);padding:11px var(--space-6);position:sticky;top:0;z-index:4;}
.tpl-item{display:block;width:100%;text-align:left;padding:var(--tpl-item-pad-y) var(--space-6);font-size:16px;color:var(--ink);border-bottom:1px solid var(--border);transition:background .12s;}
.tpl-item:hover{background:var(--bg-soft);}
.tpl-item--active{background:var(--accent-50);font-weight:700;box-shadow:inset 3px 0 0 var(--accent);border-radius:0 var(--radius) var(--radius) 0;}
.tpl-item-text{min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;}
.tpl-item-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.tpl-item-derivative{font-size:12px;font-weight:500;color:var(--gray);line-height:1.2;}
.ed-head-left{min-width:0;}
.ed-amd-hint{font-size:12.5px;color:var(--gray);margin-top:8px;padding:8px 12px;background:var(--bg-chip);border-radius:8px;line-height:1.45;}
.ed-amd-hint .ed-mono{font-size:12px;}
.link-btn{color:var(--accent);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:2px;padding:0;}
.link-btn:hover{filter:brightness(.9);}

/* editable EHR chip */
.mapping-ro{display:inline-flex;max-width:100%;}
.mapping-edit{position:relative;display:inline-flex;max-width:100%;}
/* ───────── Editor ───────── */
.editor{flex:1;overflow-y:auto;background:#fff;}
.editor-inner{max-width:1000px;margin:0 auto;padding:var(--page-pad-y) var(--page-pad-x) 80px;}
.ed-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-6);margin-bottom:var(--space-7);}
.ed-title{font-size:24px;font-weight:700;margin:0 0 8px;color:var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ed-meta{font-size:14px;color:var(--gray);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;}
.ed-mono{font-family:'Roboto Mono',monospace;color:var(--ink);font-size:13px;}
.ed-meta-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;background:var(--bg-chip);font-size:12px;font-weight:600;color:var(--gray);}
.ed-meta-tag--mono{font-family:'Roboto Mono',monospace;font-weight:400;color:var(--ink);font-size:11px;}
.btn-outline--req{min-width:260px;position:relative;}
.btn-outline-badge{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;padding:0 6px;border-radius:1000px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1;}

/* table */
.table{display:flex;flex-direction:column;gap:var(--table-gap);}
.thead{display:grid;grid-template-columns:minmax(280px,1fr) 248px 132px 70px;align-items:center;
  background:var(--bg-chip);border:1px solid var(--border);border-radius:var(--radius);min-height:var(--thead-min-height);padding:0 var(--space-6) 0 var(--table-gutter);
  position:sticky;top:0;z-index:6;box-shadow:0 1px 0 var(--border);}
.table--amd .thead,.table--amd .row-head{grid-template-columns:minmax(240px,1fr) 200px 148px 124px 70px;}
.th{font-size:14px;font-weight:700;color:var(--gray);}
.th-config{text-align:left;}
.th-enable{text-align:center;}
.tbody{display:flex;flex-direction:column;gap:var(--table-gap);}

/* row */
.row{border:1px solid var(--border);border-radius:var(--radius);background:#fff;transition:box-shadow .15s,border-color .15s;}
.row:hover{border-color:var(--accent-100);box-shadow:0 2px 10px rgba(40,47,111,.05);}
.row--open{border-color:var(--accent-100);}
.row--child{background:var(--bg-soft);}
.row--disabled{opacity:.55;}
.row--disabled .sname,.row--disabled .chip{color:var(--gray-light);}
.row--disabled:hover{box-shadow:none;border-color:var(--border);}
.expander--hidden{visibility:hidden;pointer-events:none;}
.tree-branch{position:relative;margin-left:var(--tree-step);padding-left:var(--tree-step);}
.tree-branch--d1,.tree-branch--d2{margin-left:var(--tree-step);padding-left:var(--tree-step);}
.tree-connector{position:absolute;left:0;top:0;bottom:12px;width:14px;border-left:2px solid var(--border);border-bottom:2px solid var(--border);border-bottom-left-radius:6px;}
.row--tree-last .tree-connector{bottom:50%;}
.row-inline{padding:var(--space-1) var(--space-6) var(--space-4) var(--table-gutter);}
.entity-panel{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-start;width:100%;}
.entity-segments{display:flex;flex-wrap:wrap;gap:16px 24px;}
.entity-group{display:flex;flex-direction:column;gap:5px;}
.entity-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gray);}
.seg-btns,.adv-seg-row{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;}
.seg-btn{padding:8px 16px;font-size:13px;font-weight:600;color:var(--gray);background:transparent;border-right:1px solid var(--border);transition:background .12s,color .12s;}
.seg-btn:last-child{border-right:none;}
.seg-btn:hover:not(.seg-btn--on){background:var(--bg-chip);}
.seg-btn--on{background:var(--accent);color:#fff;}
.entity-checks{display:flex;flex-direction:column;gap:10px;min-width:220px;}
.entity-check{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--ink);cursor:pointer;}
.entity-check input{margin-top:3px;flex:0 0 auto;accent-color:var(--accent);}
.entity-check-text{display:flex;flex-direction:column;gap:2px;}
.entity-check-label{font-weight:600;line-height:1.3;}
.entity-check-hint{font-size:12px;font-weight:400;color:var(--gray);line-height:1.35;}
.def-neg{flex:1;min-width:220px;max-width:360px;}
.def-neg-label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--gray);margin-bottom:6px;}
.def-neg-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;color:var(--ink);}
.def-neg-input:focus{outline:none;border-color:var(--accent);}
.ed-empty{display:flex;align-items:center;justify-content:center;min-height:420px;}
.ed-empty p{font-size:18px;color:var(--gray-light);margin:0;}
.row-head{display:grid;grid-template-columns:minmax(280px,1fr) 248px 132px 70px;align-items:center;
  padding:var(--row-pad) var(--space-6) var(--row-pad) var(--table-lead);gap:0;}
.row-name{display:flex;align-items:center;gap:2px;min-width:0;flex:1;}
.grip{display:inline-flex;align-items:center;justify-content:center;width:22px;color:var(--gray-light);cursor:grab;flex:0 0 auto;}
.grip:active{cursor:grabbing;}
.expander{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--gray);border-radius:6px;transition:transform .18s,background .12s;flex:0 0 auto;transform:rotate(-90deg);}
.expander:hover{background:var(--bg-chip);}
.expander--open{transform:rotate(0deg);color:var(--accent);}

.namecell{display:flex;align-items:center;gap:10px;min-width:0;flex:1;padding-left:var(--namecell-pl);}
.row--details-open{border-color:var(--accent-100);}
.expander--tree{flex:0 0 auto;}
.toolbox--open{background:var(--accent-50);color:var(--accent);}
.sname{font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap;flex:0 0 auto;}
.name-icons{display:flex;align-items:center;gap:4px;flex:0 0 auto;}
.sname-input{font-size:16px;font-weight:700;color:var(--ink);border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;min-width:0;flex:0 1 auto;font-family:inherit;transition:border-color .12s,background .12s;}
.sname-input:hover{background:var(--bg-chip);}
.sname-input:focus{outline:none;border-color:var(--accent);background:#fff;}

/* badges */
.cbadge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:3px 8px 3px 6px;font-size:13px;font-weight:700;cursor:default;}
.cbadge--macro{background:var(--accent);color:#fff;}
.cbadge--sum{background:var(--teal-50);color:var(--teal-text);}
.cbadge-ico{display:inline-flex;}
.cbadge--macro .cbadge-ico svg{width:15px;height:15px;}
.cbadge--sum .cbadge-ico svg{width:15px;height:15px;}

/* info tooltip */
.info-wrap{position:relative;display:inline-flex;align-items:center;}
.info-ico{color:var(--gray-light);display:inline-flex;cursor:help;}
.info-ico:hover{color:var(--accent);}
.tooltip{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(4px);
  background:#2A2D3A;color:#fff;font-size:12px;font-weight:500;line-height:1.45;padding:9px 12px;border-radius:8px;
  width:max-content;max-width:240px;opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;z-index:40;text-transform:none;letter-spacing:0;}
.tooltip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#2A2D3A;}
.info-wrap:hover .tooltip{opacity:1;transform:translateX(-50%) translateY(0);}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-chip);border-radius:5px;padding:5px 10px;
  font-size:12px;color:var(--ink);max-width:100%;}
.chip--mono{font-family:'Roboto Mono',monospace;}
.chip--ehr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:228px;display:block;line-height:1.4;}
.chip--amd-detail{font-size:11px;line-height:1.35;max-width:140px;white-space:normal;}

/* config dropdown */
.row-config{justify-self:start;}
.dd{position:relative;}
.dd-trigger{cursor:pointer;justify-content:space-between;min-width:114px;border:1px solid transparent;transition:border-color .12s;}
.dd-trigger:hover{border-color:var(--accent-100);}
.dd-caret{color:var(--gray);display:inline-flex;}
.dd-scrim{position:fixed;inset:0;z-index:30;}
.dd-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:31;background:#fff;border:1px solid var(--border);
  border-radius:8px;box-shadow:0 8px 24px rgba(40,47,111,.14);padding:5px;min-width:124px;}
.dd-opt{display:block;width:100%;text-align:left;padding:8px 10px;font-size:13px;font-family:'Roboto Mono',monospace;border-radius:6px;}
.dd-opt:hover{background:var(--bg-chip);}
.dd-opt--sel{background:var(--accent-50);color:var(--accent);font-weight:500;}

/* enable cell */
.row-enable{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-3);}
.row:not(:hover):not(:focus-within):not(.row--open) .toolbox:not(.toolbox--open){opacity:0;pointer-events:none;}
.toolbox{position:relative;width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--gray);transition:background .12s,color .12s,opacity .12s;}
.row:hover .toolbox,.row:focus-within .toolbox,.row--open .toolbox,.toolbox--open{opacity:1;pointer-events:auto;}
.toolbox:hover{background:var(--accent-50);color:var(--accent);}
.toolbox-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:1.5px solid #fff;}

/* toggle */
.toggle{width:35px;height:20px;border-radius:1000px;background:var(--border);position:relative;transition:background .18s;flex:0 0 auto;}
.toggle--on{background:var(--accent);}
.toggle--disabled{opacity:.5;cursor:not-allowed;}
.toggle-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.toggle--on .toggle-knob{left:17px;}


/* advanced inline panel */
.adv{border-top:1px solid var(--border);padding:22px 28px 20px var(--table-gutter);background:var(--bg-soft);border-radius:0 0 var(--radius) var(--radius);}
.adv-cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.adv-col{}
.adv-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:10px;}
.adv-head-ico{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;}
.adv-head-ico--purple{background:var(--accent);}
.adv-head-ico--purple svg{width:14px;height:14px;}
.adv-head-ico--teal{background:var(--teal);}
.adv-head-ico--teal svg{width:15px;height:15px;}
.adv-count{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-50);border-radius:1000px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;}
.adv-count--teal{color:var(--teal-text);background:var(--teal-50);}
.adv-empty{font-size:13px;color:var(--gray-light);padding:10px 0;}
.adv-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:8px;}
.adv-item-name{font-size:14px;color:var(--ink);font-weight:500;}
.mode-tag{font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:3px 8px;border-radius:5px;white-space:nowrap;}
.tag--amber{background:var(--amber-bg);color:var(--amber-text);}
.tag--slate{background:#EEF0F3;color:#697086;}
.tag--purple{background:var(--accent-50);color:var(--accent);}
.tag--teal{background:var(--teal-50);color:var(--teal-text);}
.adv-static{margin-top:18px;border-top:1px dashed var(--border);padding-top:16px;}
.adv-static-head{font-size:13px;font-weight:700;color:var(--gray);margin-bottom:10px;}
.adv-static-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;line-height:1.5;}
.adv-static-pos{flex:0 0 78px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);background:var(--accent-50);padding:4px 8px;border-radius:5px;text-align:center;}
.adv-static-txt{font-size:14px;color:var(--ink);line-height:1.5;}
.adv-foot{margin-top:16px;}

/* ── Details panel: section labels + divider ─── */
.adv-seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.adv-seg-btn{padding:7px 16px;font-size:13px;font-weight:600;color:var(--gray);background:transparent;border-right:1px solid var(--border);transition:background .1s,color .1s;}
.adv-seg-btn:last-child{border-right:none;}
.adv-seg-btn--on{background:var(--accent);color:#fff;}
.adv-seg-btn:not(.adv-seg-btn--on):hover{background:var(--bg-chip);}

/* ── Editable text fields ─── */
.adv-field{margin-bottom:12px;}
.adv-field:last-child{margin-bottom:0;}
.adv-field-label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:6px;}
.adv-field-textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-family:'Lato',sans-serif;font-size:13px;color:var(--ink);resize:vertical;line-height:1.5;background:#fff;transition:border-color .12s;}
.adv-field-textarea:focus{outline:none;border-color:var(--accent);}
.adv-field-textarea::placeholder{color:var(--gray-light);font-style:italic;}
.adv-field-hint{font-size:12px;color:var(--gray);margin-top:6px;line-height:1.45;}
.adv-field-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;transition:border-color .12s;}
.adv-field-input:focus{outline:none;border-color:var(--accent);}
.adv-field-input::placeholder{color:var(--gray-light);font-style:italic;}
.adv-field-input--grow{flex:1;min-width:0;}
.adv-additional-row{display:flex;gap:8px;align-items:center;}
.adv-additional-placement{flex:0 0 auto;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;cursor:pointer;}
.adv-additional-placement:focus{outline:none;border-color:var(--accent);}

/* ── 4-tab strip ─── */
.adv-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px;gap:0;}
.adv-tab{padding:9px 16px;font-size:13px;font-weight:600;color:var(--gray);background:none;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s,border-color .12s;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.adv-tab:hover{color:var(--ink);}
.adv-tab--active{color:var(--accent);border-bottom-color:var(--accent);}
.adv-tab-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;flex:0 0 auto;}
.adv-tab-body{padding:0;}
.adv-tab-heading{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;}

/* ── Toggle rows ─── */
.adv-toggle-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;}
.adv-toggle-text{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
.adv-toggle-label{font-size:14px;font-weight:600;color:var(--ink);}
.adv-toggle-hint{font-size:12px;color:var(--gray);line-height:1.4;}
.btn-text{display:inline-flex;align-items:center;gap:7px;color:var(--accent);font-weight:700;font-size:13px;padding:7px 0;}
.btn-text:hover{text-decoration:underline;}

/* ───────── Modal ───────── */
.modal-scrim{position:fixed;inset:0;background:rgba(30,30,46,.4);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:2147483647;padding:40px;animation:fade .15s ease;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal{background:#fff;border-radius:16px;width:min(920px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(20,20,40,.3);animation:pop .18s ease;min-height:0;}
@keyframes pop{from{transform:translateY(10px) scale(.99);opacity:0;}to{transform:none;opacity:1;}}
.modal-head{flex:0 0 auto;background:var(--accent-50);padding:22px 28px;position:relative;}
.modal-head h2{margin:0;font-size:20px;font-weight:900;color:var(--accent);letter-spacing:.01em;}
.modal-sub{font-size:13px;color:var(--gray);font-weight:500;}
.modal-x{position:absolute;top:20px;right:22px;color:var(--coral);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.modal-x:hover{background:rgba(255,136,136,.15);}
.modal-body{flex:1;min-height:0;padding:26px 28px;overflow-y:auto;}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:28px;}

.cl-head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:12px;}
.cl-ico{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#fff;}
.cl-ico--purple{background:var(--accent);}
.cl-ico--purple svg{width:15px;height:15px;}
.cl-ico--teal{background:var(--teal);}
.cl-ico--teal svg{width:16px;height:16px;}
.cl-count{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-50);border-radius:1000px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;}
.cl-count--teal{color:var(--teal-text);background:var(--teal-50);}
.cl-box{border:1px solid var(--border);border-radius:10px;padding:8px;min-height:120px;display:flex;flex-direction:column;gap:6px;}
.cl-empty{color:var(--gray-light);font-size:13px;padding:20px 10px;text-align:center;}
.cl-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg-soft);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.cl-name{font-size:14px;font-weight:500;color:var(--ink);}
.cl-right{display:flex;align-items:center;gap:6px;}
.cl-mode{font-family:'Roboto Mono',monospace;font-size:12px;color:var(--ink);border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:#fff;cursor:pointer;}
.cl-x{width:28px;height:28px;border-radius:6px;color:var(--gray-light);display:inline-flex;align-items:center;justify-content:center;}
.cl-x:hover{background:rgba(255,136,136,.15);color:var(--coral);}

.static-block{}
.static-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.static-hint{font-size:13px;color:var(--gray);margin:0 0 16px;}
.static-field{margin-bottom:14px;}
.static-field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);margin-bottom:6px;}
.static-field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:'Lato',sans-serif;font-size:14px;color:var(--ink);resize:vertical;line-height:1.5;transition:border-color .12s;}
.static-field textarea:focus{outline:none;border-color:var(--accent);}

.modal-foot{display:flex;justify-content:flex-end;gap:12px;padding:18px 28px;border-top:1px solid var(--border);background:#fff;flex:0 0 auto;}
.btn-ghost{padding:11px 22px;border-radius:10px;border:1px solid var(--border);font-weight:700;font-size:14px;color:var(--ink);background:#fff;}
.btn-ghost:hover{background:var(--bg-chip);}
.btn-teal{padding:11px 26px;border-radius:10px;background:var(--teal);color:#fff;font-weight:900;font-size:14px;letter-spacing:.02em;box-shadow:0 4px 12px rgba(17,201,201,.32);}
.btn-teal:hover{filter:brightness(1.04);}
.btn-teal--warn{background:var(--coral);box-shadow:0 4px 12px rgba(255,136,136,.32);}
.modal--confirm{width:min(520px,100%);}
.confirm-body{padding-top:4px;}
.confirm-lead{font-size:14px;line-height:1.55;color:var(--ink);margin:0 0 14px;}
.confirm-list{margin:0;padding-left:20px;font-size:13.5px;line-height:1.55;color:var(--gray);}
.confirm-list li{margin-bottom:8px;}
.confirm-list--warn li{color:var(--ink);}
.confirm-list--warn li::marker{color:var(--coral);}
.modal--request{width:min(720px,100%);}
.modal--disable{width:min(480px,100%);}
.modal-foot--split{justify-content:flex-end;gap:12px;}
.btn-outline-danger{padding:11px 22px;border-radius:10px;border:2px solid var(--accent);font-weight:700;font-size:14px;color:var(--accent);background:#fff;}
.btn-outline-danger:hover{background:var(--accent-50);}
.btn-teal--full{width:100%;margin-top:8px;}
.req-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px;}
.req-field label{display:block;font-size:12px;font-weight:700;color:var(--gray);margin-bottom:6px;}
.req-optional{font-weight:500;color:var(--gray-light);}
.req-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;color:var(--ink);}
.req-input:focus{outline:none;border-color:var(--accent);}
.req-textarea{resize:vertical;min-height:100px;}
.req-sub-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.req-input--inline{flex:1;min-width:180px;}
.req-check{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer;margin-right:16px;margin-bottom:8px;}
.req-apply{margin-bottom:20px;}
.req-apply-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:10px;}
.req-apply-label{font-size:12px;font-weight:700;color:var(--gray);margin:10px 0 6px;}
.req-checks{display:flex;flex-wrap:wrap;}
.req-pending{margin-top:24px;padding-top:20px;border-top:1px solid var(--border);}
.req-pending-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px;}
.req-pending-item{padding:14px 0;border-bottom:1px solid var(--border);}
.req-pending-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;}
.req-pending-name{font-size:15px;font-weight:700;color:var(--ink);}
.req-pending-when{font-size:12px;color:var(--gray);}
.req-pending-desc{font-size:13px;color:var(--gray);line-height:1.5;margin:0 0 8px;}
.req-pending-tpls{display:flex;flex-wrap:wrap;gap:6px;}
.req-pending-tag{font-size:11px;font-weight:700;padding:4px 8px;border-radius:5px;background:var(--bg-chip);color:var(--gray);}
.req-pending-item--rejected{background:#FFF5F5;border-radius:8px;padding:14px;margin-bottom:4px;border-bottom:none;}
.req-rejected-note{font-size:12px;color:#C0392B;background:#FEE8E8;border:1px solid #F8C5C5;border-radius:6px;padding:8px 12px;margin:6px 0 8px;line-height:1.5;}

/* request status pills */
.req-status-pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;flex-shrink:0;}
.req-status--pending{background:#FDF3DC;color:#C46A06;}
.req-status--approved{background:#E4F8EC;color:#1A7A3A;}
.req-status--rejected{background:#FDEAEA;color:#C0392B;}

/* request modal form layout */
.req-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.req-apply-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0 20px;}
.req-foot-row{display:flex;justify-content:flex-end;gap:10px;padding-top:4px;margin-bottom:0;}

/* toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#2A2D3A;color:#fff;font-size:14px;font-weight:500;padding:13px 22px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:200;animation:pop .18s ease;}

.nav-item:focus-visible,.tpl-item:focus-visible,.seg-btn:focus-visible,.btn-outline:focus-visible,.toolbox:focus-visible,.expander:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  .tpl-panel,.tpl-inner,.tpl-collapse svg,.expander,.toggle-knob{transition:none;}
}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:1000px;border:2px solid #fff;}
::-webkit-scrollbar-thumb:hover{background:var(--gray-light);}

/* ── Edit mode: simplified 3-column table ─── */
.table-edit .thead{grid-template-columns:minmax(280px,1fr) 264px 100px;}
.table-edit .row-head{grid-template-columns:minmax(280px,1fr) 264px 100px;}
.table--ecw.table-edit .thead,.table--ecw.table-edit .row-head{grid-template-columns:minmax(220px,1fr) 200px 148px 80px;}

/* ── Row mapping / actions cells ─── */
.row-mapping{display:flex;flex-direction:column;align-items:flex-start;gap:4px;justify-content:center;}
.row-actions{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-3);}

/* ── Drag and drop ─── */
.row--dragging{opacity:.3;pointer-events:none;}
.row--drop-before{box-shadow:0 -3px 0 var(--accent),0 2px 10px rgba(40,47,111,.05);}
.row--drop-after{box-shadow:0 3px 0 var(--accent),0 2px 10px rgba(40,47,111,.05);}

/* ── Editable mapping chip ─── */
.mapping-cell-wrap{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap;}
.mapping-edit-btn{
  display:inline-flex;align-items:center;gap:5px;max-width:218px;
  background:var(--bg-chip);border:1px solid transparent;border-radius:6px;
  padding:5px 8px 5px 10px;cursor:pointer;transition:border-color .12s,background .12s;
}
.mapping-edit-btn:hover{border-color:var(--accent);background:var(--accent-50);}
.mapping-edit-btn--checkbox{background:#fefce8;border-color:#fde68a;}
.mapping-edit-btn--checkbox:hover{background:#fef9c3;border-color:#f59e0b;}
.mapping-edit-label{font-family:'Roboto Mono',monospace;font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.mapping-edit-btn--empty .mapping-edit-label{color:var(--gray-light);font-style:italic;font-family:'Lato',sans-serif;font-size:13px;}
.mapping-edit-ico{color:var(--gray-light);display:inline-flex;flex:0 0 auto;transition:color .12s;}
.mapping-edit-btn:hover .mapping-edit-ico{color:var(--accent);}
.mapping-cb-ico{font-size:12px;line-height:1;flex:0 0 auto;}
.mapping-type-tag{font-size:10px;font-weight:700;letter-spacing:.02em;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:3px;padding:0 4px;flex:0 0 auto;font-family:'Lato',sans-serif;}
.mapping-cb-values{font-size:11px;color:#92400e;white-space:nowrap;}
.mapping-warn{color:var(--amber-text);display:inline-flex;align-items:center;flex:0 0 auto;cursor:help;}

/* ── Parent mapping mode toggle ─── */
.mapping-mode-wrap{display:flex;flex-direction:column;gap:6px;min-width:0;}
.mapping-mode-seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex:0 0 auto;}
.mapping-mode-btn{padding:3px 10px;font-size:11px;font-weight:700;color:var(--gray);background:transparent;border-right:1px solid var(--border);transition:background .1s,color .1s;}
.mapping-mode-btn:last-child{border-right:none;}
.mapping-mode-btn--on{background:var(--accent);color:#fff;}
.mapping-mode-btn:not(.mapping-mode-btn--on):hover{background:var(--bg-chip);}
.mapping-individual-note{font-size:12px;color:var(--gray);font-style:italic;}
.mapping-inherited{font-size:12px;color:var(--gray-light);font-style:italic;padding:5px 2px;}

/* ── Mapping picker drawer ─── */
.mapping-picker-scrim{position:fixed;inset:0;z-index:80;background:rgba(20,20,40,.18);}
.mapping-picker{
  position:fixed;top:0;right:0;bottom:0;width:340px;
  background:#fff;box-shadow:-6px 0 40px rgba(40,47,111,.18);
  display:flex;flex-direction:column;z-index:81;
  animation:slideInR .2s cubic-bezier(.4,0,.2,1);
}
@keyframes slideInR{from{transform:translateX(100%);}to{transform:translateX(0);}}
.mapping-picker-head{padding:20px 20px 14px;border-bottom:1px solid var(--border);background:var(--accent-50);}
.mapping-picker-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.mapping-picker-title{font-size:16px;font-weight:900;color:var(--accent);}
.mapping-picker-close{color:var(--gray);display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;}
.mapping-picker-close:hover{background:rgba(255,255,255,.6);color:var(--coral);}
.mapping-picker-sub{font-size:13px;color:var(--gray);}
.mapping-picker-sub strong{color:var(--ink);}
.mapping-picker-current{margin-top:6px;font-size:12px;color:var(--gray);}
.mapping-picker-current-val{font-family:'Roboto Mono',monospace;color:var(--accent);font-weight:600;}
.mapping-picker-search{padding:12px 14px;border-bottom:1px solid var(--border);}
.mapping-picker-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;font-family:'Lato',sans-serif;color:var(--ink);}
.mapping-picker-input:focus{outline:none;border-color:var(--accent);}
.mapping-picker-body{flex:1;overflow-y:auto;padding:8px;}
.mapping-picker-group-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-light);padding:10px 8px 4px;}
.mapping-picker-field{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13px;font-family:'Roboto Mono',monospace;color:var(--ink);text-align:left;transition:background .1s;}
.mapping-picker-field:hover{background:var(--bg-chip);}
.mapping-picker-field--selected{background:var(--accent-50);color:var(--accent);font-weight:600;}
.mapping-picker-field--checkbox{background:#fffbeb;}
.mapping-picker-field--checkbox:hover{background:#fef3c7;}
.mapping-picker-field--checkbox.mapping-picker-field--selected{background:#fef9c3;color:#92400e;}
.mapping-picker-field-main{display:inline-flex;align-items:center;gap:6px;min-width:0;flex:1;}
.mapping-picker-cb-ico{font-size:12px;line-height:1;flex:0 0 auto;}
.mapping-picker-check{color:var(--accent);display:inline-flex;flex:0 0 auto;}
.mapping-picker-empty{padding:28px 16px;text-align:center;font-size:13px;color:var(--gray-light);}
.mapping-picker-foot{padding:12px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.mapping-picker-clear{display:flex;align-items:center;gap:6px;color:var(--coral);font-size:13px;font-weight:600;padding:9px 10px;border-radius:7px;width:100%;text-align:left;}
.mapping-picker-clear:hover{background:rgba(255,136,136,.1);}
.mapping-picker-checkbox-hint{font-size:12px;color:#78350f;background:#fffbeb;border:1px solid #fde68a;border-radius:7px;padding:8px 10px;line-height:1.4;}
.mapping-picker-checkbox-hint-sub{font-size:11px;color:#92400e;margin-top:4px;opacity:.9;}
.mapping-picker--ecw{width:680px;}
.mapping-picker-ecw-body{display:flex;flex:1;overflow:hidden;}
.mapping-picker-ecw-col{display:flex;flex-direction:column;flex:1;overflow:hidden;border-right:1px solid var(--border);}
.mapping-picker-ecw-col--scribe{border-right:none;}
.mapping-picker-ecw-col-label{padding:10px 14px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);background:var(--accent-50);border-bottom:1px solid var(--accent-100);}
.mapping-picker-ecw-col .mapping-picker-body{flex:1;overflow-y:auto;}
.mapping-picker-ecw-col .mapping-picker-search{border-bottom:1px solid var(--border);}
.mapping-picker-ecw-col .mapping-picker-foot{border-top:1px solid var(--border);}
.mapping-picker-optional{margin-left:6px;font-size:10px;font-weight:400;color:var(--gray-light);text-transform:none;letter-spacing:0;}
.mapping-picker-confirm-bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:#fff;}

/* ── Editor toolbar (save / reset) ─── */
.ed-head-right{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.btn-sm{padding:8px 16px !important;font-size:13px !important;border-radius:8px !important;font-weight:700 !important;}


@media (prefers-reduced-motion:reduce){
  .mapping-picker{animation:none;}
}

/* ── Style tab: default state & reset ── */
.adv-tab-heading-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.adv-tab-heading-row .adv-tab-heading{margin-bottom:0;}
.adv-default-badge{font-size:11px;font-weight:600;color:var(--gray-light);background:var(--bg-chip);border-radius:20px;padding:3px 10px;white-space:nowrap;}
.adv-reset-link{font-size:12px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;}
.adv-reset-link:hover{color:var(--coral);}
.adv-seg-btn--default{color:var(--gray);}
.adv-seg-default-label{font-size:10px;font-weight:400;opacity:.7;}
.adv-field-optional{font-size:11px;font-weight:400;color:var(--gray-light);margin-left:4px;}
.adv-char-limit{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;background:var(--amber-bg);border:1px solid #F0C87A;border-radius:8px;padding:10px 12px;margin-bottom:14px;}
.adv-char-limit-label{font-size:11px;font-weight:700;color:var(--amber-text);text-transform:uppercase;letter-spacing:.04em;}
.adv-char-limit-val{font-size:13px;font-weight:600;color:var(--amber-text);}
.adv-char-limit-hint{font-size:11px;color:var(--amber-text);opacity:.8;width:100%;margin-top:2px;}

/* ── EHR-specific secondary column ── */
.th-ehr-badge{margin-left:6px;font-size:10px;font-weight:700;background:var(--accent-50);color:var(--accent);border-radius:4px;padding:1px 5px;vertical-align:middle;letter-spacing:.02em;}
.row-ehr-secondary{flex:0 0 140px;display:flex;align-items:center;padding:0 8px;}
.ehr-config-chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--bg-chip);color:var(--gray);}
.ehr-config-chip--prepend{background:#EEF0FF;color:#4F46E5;}
.ehr-config-chip--append{background:var(--teal-50);color:var(--teal-text);}
.ehr-config-chip--replace{background:var(--amber-bg);color:var(--amber-text);}
.ehr-scribeit-btn{background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;}
.ehr-scribeit-btn:hover .ehr-scribeit-chip{background:var(--accent-100);}
.ehr-scribeit-btn:hover .ehr-scribeit-empty{color:var(--accent);}
.ehr-scribeit-chip{font-size:11px;font-weight:500;color:var(--ink);background:var(--bg-chip);padding:2px 8px;border-radius:5px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ehr-scribeit-empty{font-size:11px;color:var(--gray-light);font-style:italic;}

/* Cat 4 — no push banner */
.ehr-no-push-banner {
  display: flex; align-items: center; gap: 12px;
  background: #fff8ec; border: 1px solid #f5c842;
  border-radius: 10px; padding: 12px 16px; margin-bottom: 12px;
}
.ehr-no-push-icon { font-size: 18px; flex-shrink: 0; }
.ehr-no-push-body { flex: 1; font-size: 13px; color: #5c4a00; }

/* Push issues — row strip + banner actions */
.row-push-error{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#fff5f5;border-top:1px solid #fecaca;font-size:13px;flex-wrap:wrap;}
.row-push-error--selfserve{background:#fffbeb;border-top-color:#fde68a;}
.row-push-error-body{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.row-push-error-icon{color:#dc2626;flex:0 0 auto;}
.row-push-error--selfserve .row-push-error-icon{color:#b45309;}
.row-push-error-msg{color:#7f1d1d;flex:1;min-width:0;}
.row-push-error--selfserve .row-push-error-msg{color:#78350f;}
.row-push-error-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.row-push-error-remap,.row-push-error-support,.row-push-error-dismiss{flex:0 0 auto;appearance:none;border:1px solid currentColor;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;}
.row-push-error-remap{color:var(--accent);border-color:var(--accent);}
.row-push-error-remap:hover{background:var(--accent);color:#fff;}
.row-push-error-support{color:#dc2626;border-color:#fca5a5;}
.row-push-error-support:hover{background:#fee2e2;}
.row-push-error-dismiss{color:#92400e;border-color:#fde68a;}
.row-push-error-dismiss:hover{background:#fef3c7;}
.row-default-neg{display:flex;align-items:center;gap:4px;margin-top:4px;}
.row-default-neg-label{font-size:11px;color:var(--gray);white-space:nowrap;flex:0 0 auto;}
.row-default-neg-input{font-size:11px;color:var(--gray);border:none;border-bottom:1px dashed var(--border);background:transparent;padding:1px 4px;min-width:0;flex:1;font-family:inherit;outline:none;max-width:200px;}
.row-default-neg-input:focus{border-bottom-color:var(--accent);color:var(--ink);}
.row-default-neg-input::placeholder{color:var(--gray-light);font-style:italic;}
.row-icon-btn{position:relative;appearance:none;border:none;border-radius:20px;background:transparent;color:var(--gray-light);font-size:11px;font-weight:700;height:20px;padding:0 7px;display:flex;align-items:center;gap:3px;cursor:pointer;transition:background .12s,color .12s;white-space:nowrap;opacity:0;}
.row-icon-btn--active{opacity:1;background:var(--accent-50);color:var(--accent);}
.row-icon-btn--open{opacity:1;background:var(--accent);color:#fff;}
.row-icon-btn:hover{opacity:1;background:var(--accent-50);color:var(--accent);}
.row-icon-dot{display:none;}
.name-icons:hover .row-icon-btn{opacity:.4;}
.name-icons:hover .row-icon-btn--active,.name-icons:hover .row-icon-btn--open{opacity:1;}

/* ── Prompt / delete actions — always visible (row-actions, not the hover-reveal name-icons) ── */
.row-actions .row-icon-btn{opacity:1;color:var(--gray);background:var(--bg-chip);}
.row-actions .row-icon-btn--prompt{font-size:11px;font-weight:700;padding:0 9px;}
.row-actions .row-icon-btn--danger{color:var(--coral);}
.row-actions .row-icon-btn--danger:hover{background:rgba(255,136,136,.14);color:var(--coral);}
.row-prompt-missing{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:var(--amber-text);color:#fff;font-size:9px;font-weight:800;margin-left:4px;}

/* ── Prompt panel (expanded under a row) ── */
.row-prompt-panel{padding:12px 16px 14px;border-top:1px dashed var(--border);background:var(--surface);}
.row-prompt-label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);margin-bottom:6px;}
.row-prompt-label-hint{font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--gray-light);margin-left:6px;}
.row-prompt-textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-family:'Lato',sans-serif;font-size:13px;color:var(--ink);resize:vertical;line-height:1.5;background:#fff;}
.row-prompt-textarea:focus{outline:none;border-color:var(--accent);}
.row-prompt-textarea::placeholder{color:var(--gray-light);font-style:italic;}

/* ── Section toolbar — Add Section / Fetch fields ── */
.section-toolbar{display:flex;align-items:center;gap:10px;padding:0 0 14px;flex-wrap:wrap;}
.add-section-btn:disabled{opacity:.5;cursor:not-allowed;}
.section-toolbar-hint{font-size:12px;color:var(--gray);margin-left:auto;}

/* ── Add Subsection ghost row ── */
.add-subsection-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);background:none;border:1px dashed var(--accent-100);border-radius:8px;padding:7px 12px;margin:4px 0 8px;cursor:pointer;transition:background .12s,border-color .12s;}
.add-subsection-btn:hover{background:var(--accent-50);border-color:var(--accent);}

/* ── Add Section / Add Subsection modal ── */
.modal--add-section .add-section-field-list{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px;margin-top:8px;}
.row-popover{position:absolute;top:calc(100% + 6px);right:0;z-index:100;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.1);min-width:220px;padding:10px 0;}
.row-popover-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--gray);padding:0 14px 8px;}
.row-popover-item{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;font-size:13px;color:var(--ink);}
.row-popover-item:hover{background:var(--surface);}
.row-popover-empty{font-size:13px;color:var(--gray);padding:4px 14px;}
.tpl-settings-stack{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.tpl-settings-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;flex-wrap:wrap;}
.tpl-settings-label{font-size:13px;font-weight:600;color:var(--ink);flex:0 0 auto;}
.tpl-settings-select{border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;cursor:pointer;}
.tpl-settings-select:focus{outline:none;border-color:var(--accent);}
.tpl-settings-input{width:110px;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;}
.tpl-settings-input:focus{outline:none;border-color:var(--accent);}
.tpl-settings-hint{font-size:12px;color:var(--gray);flex:1;min-width:180px;}
.tpl-settings-seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;flex:0 0 auto;}
.tpl-settings-seg-btn{padding:6px 12px;font-size:12px;font-weight:700;color:var(--gray);background:#fff;border-right:1px solid var(--border);cursor:pointer;}
.tpl-settings-seg-btn:last-child{border-right:none;}
.tpl-settings-seg-btn--on{background:var(--accent);color:#fff;}
.tpl-settings-seg-btn:not(.tpl-settings-seg-btn--on):hover{background:var(--bg-chip);color:var(--ink);}
.adv-char-limit-edit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.adv-field-input--narrow{width:110px;flex:0 0 auto;}
.adv-char-limit-unit{font-size:12px;color:var(--gray);}
.adv-char-limit-hint-line{font-size:11px;color:var(--amber-text);margin-top:6px;}
.push-issues-banner {
  background: #fff2f2; border: 1px solid #fca5a5;
  border-radius: 10px; padding: 12px 16px; margin-bottom: 12px;
}
.push-issues-head {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; color: #991b1b; margin-bottom: 8px;
}
.push-issues-dismiss {
  margin-left: auto; background: none; border: none;
  cursor: pointer; color: #991b1b; font-size: 14px; padding: 0 4px;
}
.push-issues-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.push-issues-item { display: flex; align-items: center; justify-content: space-between; }
.push-issues-section { font-size: 13px; color: #3b0000; }
.push-issues-banner--selfserve {
  background: #fffbeb; border-color: #fde68a;
}
.push-issues-banner--selfserve .push-issues-head { color: #92400e; }
.push-issues-banner--selfserve .push-issues-dismiss { color: #92400e; }
.push-issues-banner--selfserve .push-issues-section { color: #78350f; }
.push-issues-item { gap: 8px; flex-wrap: wrap; }
.push-issues-remap,.push-issues-support {
  font-size: 12px; font-weight: 500; color: #991b1b;
  background: none; border: 1px solid #fca5a5; border-radius: 6px;
  padding: 2px 10px; cursor: pointer;
}
.push-issues-remap:hover,.push-issues-support:hover { background: #fee2e2; }
.push-issues-banner--selfserve .push-issues-remap {
  color: #92400e; border-color: #fde68a;
}
.push-issues-banner--selfserve .push-issues-remap:hover { background: #fef3c7; }
.push-issues-foot {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: #6b2020;
}

/* Mapping picker — fetch/fixed notices */
.mapping-picker-fixed-notice {
  font-size: 11px; color: #6b7280;
  background: #f9fafb; border-radius: 6px;
  padding: 6px 10px; margin: 0 0 8px;
}
.mapping-picker-charm-notice{display:flex;align-items:flex-start;gap:10px;background:var(--amber-bg);border-radius:6px;padding:8px 12px;margin:0 0 8px;font-size:12px;color:var(--amber-text);}
.mapping-picker-support-btn{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--amber-text);border:1px solid var(--amber-text);border-radius:5px;padding:3px 10px;background:transparent;white-space:nowrap;cursor:pointer;}
.mapping-picker-support-btn:hover{background:var(--amber-text);color:#fff;}

/* Auto-mapped / no-push labels in mapping cell */
.mapping-auto-label {
  font-size: 12px; color: #059669; font-style: italic;
}
.mapping-no-push-label {
  font-size: 12px; color: #9ca3af; font-style: italic;
}
.mapping-pending-label {
  font-size: 12px; color: var(--amber-text); font-style: italic; cursor: default;
}
.cat4-notice {
  display: flex; align-items: flex-start; gap: 10px;
  background: #f0f4ff; border: 1px solid #c7d2fe;
  border-radius: 8px; padding: 10px 14px; margin: 0 0 16px;
  font-size: 13px; color: #3730a3;
}
.cat4-notice-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.cat4-notice-text { line-height: 1.5; }

/* EHR template-level banner */
.ehr-tpl-banner {
  display: flex; align-items: center; gap: 12px;
  background: #f0f0ff; border: 1px solid #c7c9f9;
  border-radius: 10px; padding: 12px 16px; margin-bottom: 12px;
}
.ehr-tpl-banner-left { flex: 1; display: flex; flex-direction: column; gap: 2px; }
